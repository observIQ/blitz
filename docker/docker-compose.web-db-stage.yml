# Web & Database Logs - Docker Compose Configuration (Stage)
#
# Generates Apache (10x), PostgreSQL, and Kubernetes logs via TCP.
#
# Usage:
#   OPAMP_ENDPOINT_STAGE=wss://stage.bindplane.com/v1/opamp \
#   OPAMP_SECRET_KEY_STAGE=your-secret-key \
#   docker compose -f docker/docker-compose.web-db-stage.yml -p web-db-stage up
#
# TCP Port: 5150

x-blitz-common: &blitz-common
  image: blitz:local
  restart: unless-stopped
  environment:
    BLITZ_OUTPUT_TYPE: tcp
    BLITZ_OUTPUT_TCP_HOST: collector-web-db-stage
    BLITZ_OUTPUT_TCP_PORT: "5150"
    BLITZ_LOGGING_LEVEL: info
  depends_on:
    - collector-web-db-stage
  networks:
    - web-db-stage-net

services:
  collector-web-db-stage:
    image: observiq/bindplane-agent:latest
    restart: unless-stopped
    user: "0"
    environment:
      OPAMP_ENDPOINT: ${OPAMP_ENDPOINT_STAGE:?OPAMP_ENDPOINT_STAGE is required}
      OPAMP_SECRET_KEY: ${OPAMP_SECRET_KEY_STAGE:?OPAMP_SECRET_KEY_STAGE is required}
      OPAMP_AGENT_NAME: blitz-web-db-collector-stage
      OPAMP_LABELS: "env=stage,pipeline=web-db"
    ports:
      - "5150:5150"
    networks:
      - web-db-stage-net

  # Apache Log Generator (10x workers)
  blitz-apache-stage:
    <<: *blitz-common
    environment:
      BLITZ_GENERATOR_TYPE: apache-common
      BLITZ_GENERATOR_APACHECOMMON_WORKERS: ${BLITZ_APACHE_WORKERS:-10}
      BLITZ_GENERATOR_APACHECOMMON_RATE: ${BLITZ_RATE:-1s}
      BLITZ_OUTPUT_TYPE: tcp
      BLITZ_OUTPUT_TCP_HOST: collector-web-db-stage
      BLITZ_OUTPUT_TCP_PORT: "5150"

  # PostgreSQL Log Generator (1x workers)
  blitz-postgres-stage:
    <<: *blitz-common
    environment:
      BLITZ_GENERATOR_TYPE: postgres
      BLITZ_GENERATOR_POSTGRES_WORKERS: ${BLITZ_WORKERS:-1}
      BLITZ_GENERATOR_POSTGRES_RATE: ${BLITZ_RATE:-1s}
      BLITZ_OUTPUT_TYPE: tcp
      BLITZ_OUTPUT_TCP_HOST: collector-web-db-stage
      BLITZ_OUTPUT_TCP_PORT: "5150"

  # Kubernetes Log Generator (1x workers)
  blitz-kubernetes-stage:
    <<: *blitz-common
    environment:
      BLITZ_GENERATOR_TYPE: kubernetes
      BLITZ_GENERATOR_KUBERNETES_WORKERS: ${BLITZ_WORKERS:-1}
      BLITZ_GENERATOR_KUBERNETES_RATE: ${BLITZ_RATE:-1s}
      BLITZ_OUTPUT_TYPE: tcp
      BLITZ_OUTPUT_TCP_HOST: collector-web-db-stage
      BLITZ_OUTPUT_TCP_PORT: "5150"

networks:
  web-db-stage-net:
    driver: bridge
