# JSON & PII Logs - Docker Compose Configuration (Stage)
#
# Generates JSON (1x) and PII (15x) logs via TCP.
#
# Usage:
#   OPAMP_ENDPOINT_STAGE=wss://stage.bindplane.com/v1/opamp \
#   OPAMP_SECRET_KEY_STAGE=your-secret-key \
#   docker compose -f docker/docker-compose.json-pii-stage.yml -p json-pii-stage up
#
# TCP Port: 5170

x-blitz-common: &blitz-common
  image: blitz:local
  restart: unless-stopped
  environment:
    BLITZ_OUTPUT_TYPE: tcp
    BLITZ_OUTPUT_TCP_HOST: collector-json-pii-stage
    BLITZ_OUTPUT_TCP_PORT: "5170"
    BLITZ_LOGGING_LEVEL: info
  depends_on:
    - collector-json-pii-stage
  networks:
    - json-pii-stage-net

services:
  collector-json-pii-stage:
    image: observiq/bindplane-agent:latest
    restart: unless-stopped
    user: "0"
    environment:
      OPAMP_ENDPOINT: ${OPAMP_ENDPOINT_STAGE:?OPAMP_ENDPOINT_STAGE is required}
      OPAMP_SECRET_KEY: ${OPAMP_SECRET_KEY_STAGE:?OPAMP_SECRET_KEY_STAGE is required}
      OPAMP_AGENT_NAME: blitz-json-pii-collector-stage
      OPAMP_LABELS: "env=stage,pipeline=json-pii"
      OPAMP_CONFIG: ${OPAMP_CONFIG_JSON_PII_STAGE:-blitz-json-pii}
    ports:
      - "5170:5170"
    volumes:
      - collector-json-pii-stage-data:/etc/otel
    networks:
      - json-pii-stage-net

  # JSON Log Generator (1x workers)
  blitz-json-stage:
    <<: *blitz-common
    environment:
      BLITZ_GENERATOR_TYPE: json
      BLITZ_GENERATOR_JSON_WORKERS: ${BLITZ_WORKERS:-1}
      BLITZ_GENERATOR_JSON_RATE: ${BLITZ_RATE:-1s}
      BLITZ_OUTPUT_TYPE: tcp
      BLITZ_OUTPUT_TCP_HOST: collector-json-pii-stage
      BLITZ_OUTPUT_TCP_PORT: "5170"

  # PII Log Generator (15x workers)
  blitz-pii-stage:
    <<: *blitz-common
    environment:
      BLITZ_GENERATOR_TYPE: json
      BLITZ_GENERATOR_JSON_TYPE: pii
      BLITZ_GENERATOR_JSON_WORKERS: ${BLITZ_PII_WORKERS:-15}
      BLITZ_GENERATOR_JSON_RATE: ${BLITZ_RATE:-1s}
      BLITZ_OUTPUT_TYPE: tcp
      BLITZ_OUTPUT_TCP_HOST: collector-json-pii-stage
      BLITZ_OUTPUT_TCP_PORT: "5170"

networks:
  json-pii-stage-net:
    driver: bridge

volumes:
  collector-json-pii-stage-data:
