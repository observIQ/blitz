# JSON & PII Logs - Docker Compose Configuration (Production)
#
# Generates JSON (1x) and PII (15x) logs via TCP.
#
# Usage:
#   OPAMP_ENDPOINT=wss://app.bindplane.com/v1/opamp \
#   OPAMP_SECRET_KEY=your-secret-key \
#   docker compose -f docker/docker-compose.json-pii.yml -p json-pii up
#
# TCP Port: 5160

x-blitz-common: &blitz-common
  image: blitz:local
  restart: unless-stopped
  environment:
    BLITZ_OUTPUT_TYPE: tcp
    BLITZ_OUTPUT_TCP_HOST: collector-json-pii
    BLITZ_OUTPUT_TCP_PORT: "5160"
    BLITZ_LOGGING_LEVEL: info
  depends_on:
    - collector-json-pii
  networks:
    - json-pii-net

services:
  collector-json-pii:
    image: observiq/bindplane-agent:latest
    restart: unless-stopped
    user: "0"
    environment:
      OPAMP_ENDPOINT: ${OPAMP_ENDPOINT:?OPAMP_ENDPOINT is required}
      OPAMP_SECRET_KEY: ${OPAMP_SECRET_KEY:?OPAMP_SECRET_KEY is required}
      OPAMP_AGENT_NAME: blitz-json-pii-collector
      OPAMP_LABELS: "env=production,pipeline=json-pii"
    ports:
      - "5160:5160"
    networks:
      - json-pii-net

  # JSON Log Generator (1x workers)
  blitz-json:
    <<: *blitz-common
    environment:
      BLITZ_GENERATOR_TYPE: json
      BLITZ_GENERATOR_JSON_WORKERS: ${BLITZ_WORKERS:-1}
      BLITZ_GENERATOR_JSON_RATE: ${BLITZ_RATE:-1s}
      BLITZ_OUTPUT_TYPE: tcp
      BLITZ_OUTPUT_TCP_HOST: collector-json-pii
      BLITZ_OUTPUT_TCP_PORT: "5160"

  # PII Log Generator (15x workers)
  blitz-pii:
    <<: *blitz-common
    environment:
      BLITZ_GENERATOR_TYPE: json
      BLITZ_GENERATOR_JSON_TYPE: pii
      BLITZ_GENERATOR_JSON_WORKERS: ${BLITZ_PII_WORKERS:-15}
      BLITZ_GENERATOR_JSON_RATE: ${BLITZ_RATE:-1s}
      BLITZ_OUTPUT_TYPE: tcp
      BLITZ_OUTPUT_TCP_HOST: collector-json-pii
      BLITZ_OUTPUT_TCP_PORT: "5160"

networks:
  json-pii-net:
    driver: bridge
