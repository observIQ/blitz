# Web & Database Logs - Docker Compose Configuration (Production)
#
# Generates Apache (10x), PostgreSQL, and Kubernetes logs via TCP.
#
# Usage:
#   OPAMP_ENDPOINT=wss://app.bindplane.com/v1/opamp \
#   OPAMP_SECRET_KEY=your-secret-key \
#   docker compose -f docker/docker-compose.web-db.yml -p web-db up
#
# TCP Port: 5140

x-blitz-common: &blitz-common
  image: blitz:local
  restart: unless-stopped
  environment:
    BLITZ_OUTPUT_TYPE: tcp
    BLITZ_OUTPUT_TCP_HOST: collector-web-db
    BLITZ_OUTPUT_TCP_PORT: "5140"
    BLITZ_LOGGING_LEVEL: info
  depends_on:
    - collector-web-db
  networks:
    - web-db-net

services:
  collector-web-db:
    image: observiq/bindplane-agent:latest
    restart: unless-stopped
    user: "0"
    environment:
      OPAMP_ENDPOINT: ${OPAMP_ENDPOINT:?OPAMP_ENDPOINT is required}
      OPAMP_SECRET_KEY: ${OPAMP_SECRET_KEY:?OPAMP_SECRET_KEY is required}
      OPAMP_AGENT_NAME: blitz-web-db-collector
      OPAMP_LABELS: "env=production,pipeline=web-db"
    ports:
      - "5140:5140"
    networks:
      - web-db-net

  # Apache Log Generator (10x workers)
  blitz-apache:
    <<: *blitz-common
    environment:
      BLITZ_GENERATOR_TYPE: apache-common
      BLITZ_GENERATOR_APACHECOMMON_WORKERS: ${BLITZ_APACHE_WORKERS:-10}
      BLITZ_GENERATOR_APACHECOMMON_RATE: ${BLITZ_RATE:-1s}
      BLITZ_OUTPUT_TYPE: tcp
      BLITZ_OUTPUT_TCP_HOST: collector-web-db
      BLITZ_OUTPUT_TCP_PORT: "5140"

  # PostgreSQL Log Generator (1x workers)
  blitz-postgres:
    <<: *blitz-common
    environment:
      BLITZ_GENERATOR_TYPE: postgres
      BLITZ_GENERATOR_POSTGRES_WORKERS: ${BLITZ_WORKERS:-1}
      BLITZ_GENERATOR_POSTGRES_RATE: ${BLITZ_RATE:-1s}
      BLITZ_OUTPUT_TYPE: tcp
      BLITZ_OUTPUT_TCP_HOST: collector-web-db
      BLITZ_OUTPUT_TCP_PORT: "5140"

  # Kubernetes Log Generator (1x workers)
  blitz-kubernetes:
    <<: *blitz-common
    environment:
      BLITZ_GENERATOR_TYPE: kubernetes
      BLITZ_GENERATOR_KUBERNETES_WORKERS: ${BLITZ_WORKERS:-1}
      BLITZ_GENERATOR_KUBERNETES_RATE: ${BLITZ_RATE:-1s}
      BLITZ_OUTPUT_TYPE: tcp
      BLITZ_OUTPUT_TCP_HOST: collector-web-db
      BLITZ_OUTPUT_TCP_PORT: "5140"

networks:
  web-db-net:
    driver: bridge
