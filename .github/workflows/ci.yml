name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Graphite CI optimization: skip redundant CI runs for stacked PRs.
  # See https://graphite.com/docs/stacking-and-ci
  optimize_ci:
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      skip: ${{ steps.check_skip.outputs.skip }}
    steps:
      - name: Optimize CI
        id: check_skip
        uses: withgraphite/graphite-ci-action@26bc0dcdeaba101794931d67a464ecbb21a76a8b # v0.0.9 tag (no formal releases)
        with:
          graphite_token: ${{ secrets.GRAPHITE_CI_OPTIMIZER_TOKEN }}

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    needs: optimize_ci
    if: ${{ needs.optimize_ci.outputs.skip != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run ShellCheck (package/scripts)
        run: |
          find package/scripts -type f -name "*.sh" -exec shellcheck {} +

      - name: Run ShellCheck (scripts)
        run: |
          find scripts -type f -name "*.sh" -exec shellcheck {} +

  setup:
    name: Setup environment
    runs-on: ubuntu-latest
    needs: optimize_ci
    if: ${{ needs.optimize_ci.outputs.skip != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: |
          go env
          go mod download

      - name: Install tools
        run: |
          make install-tools

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [optimize_ci, setup]
    if: ${{ needs.optimize_ci.outputs.skip != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: |
          go test ./...

      - name: Run embedded-library tests
        run: |
          make test-embedded

  gosec:
    name: Gosec
    runs-on: ubuntu-latest
    needs: [optimize_ci, setup]
    if: ${{ needs.optimize_ci.outputs.skip != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run gosec
        run: |
          make security

  revive:
    name: Revive
    runs-on: ubuntu-latest
    needs: [optimize_ci, setup]
    if: ${{ needs.optimize_ci.outputs.skip != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run revive
        run: |
          make lint

  build:
    name: Build - ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: [optimize_ci, setup]
    if: ${{ needs.optimize_ci.outputs.skip != 'true' && github.event_name != 'merge_group' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set build host platform
        run: |
          echo "BUILD_HOST_OS=$(go env GOHOSTOS)" >> $GITHUB_ENV
          echo "BUILD_HOST_ARCH=$(go env GOHOSTARCH)" >> $GITHUB_ENV

      - name: Run GoReleaser (split)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser-pro
          version: "v2.12.5"
          args: release --clean --skip=publish --skip=sign --skip=validate --snapshot --split
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          BUILD_HOST_OS: ${{ env.BUILD_HOST_OS }}
          BUILD_HOST_ARCH: ${{ env.BUILD_HOST_ARCH }}
          GGOOS: ${{ matrix.goos }}
          GGOARCH: ${{ matrix.goarch }}

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 1

  merge-build:
    name: Merge Build
    runs-on: ubuntu-latest
    needs: [optimize_ci, setup, build]
    if: ${{ needs.optimize_ci.outputs.skip != 'true' && github.event_name != 'merge_group' }}
    env:
      cinc_package: https://packages.cinc.sh/files/stable/cinc-auditor/4.56.58/ubuntu/22.04/cinc-auditor_4.56.58-1_amd64.deb
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Tree
        run: |
          sudo apt-get install -y tree

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set build host platform
        run: |
          echo "BUILD_HOST_OS=$(go env GOHOSTOS)" >> $GITHUB_ENV
          echo "BUILD_HOST_ARCH=$(go env GOHOSTARCH)" >> $GITHUB_ENV

      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Run GoReleaser (merge)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser-pro
          version: "v2.12.5"
          args: continue --merge --skip=publish --skip=sign --skip=validate
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          BUILD_HOST_OS: ${{ env.BUILD_HOST_OS }}
          BUILD_HOST_ARCH: ${{ env.BUILD_HOST_ARCH }}

      - run: tree dist/

      - name: Prepare CINC directory
        run: mkdir -p /tmp/cinc

      - name: Cache CINC package
        id: cache-cinc
        uses: actions/cache@v6
        with:
          path: /tmp/cinc/cinc.deb
          key: cinc-auditor-4.56.58

      - name: Download CINC (Inspec)
        if: steps.cache-cinc.outputs.cache-hit != 'true'
        run: |
          curl -L -o /tmp/cinc/cinc.deb $cinc_package

      - name: Install CINC
        run: |
          sudo apt-get update
          sudo apt-get install -y -f /tmp/cinc/cinc.deb

      - name: Install package
        run: |
          sudo apt-get install -y -f ./dist/linux_amd64/blitz_amd64.deb

      - name: Start service
        run: sudo systemctl start blitz

      - name: Run install tests
        run: |
          sudo cinc-auditor exec package/inspec/install/package.rb

      - name: Uninstall package
        run: |
          sudo apt-get remove -y blitz

      - name: Run uninstall tests
        run: |
          sudo cinc-auditor exec package/inspec/remove/package.rb

  man-check:
    name: Man pages
    runs-on: ubuntu-latest
    needs: [optimize_ci, setup]
    if: ${{ needs.optimize_ci.outputs.skip != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate and verify man pages
        run: |
          make man-check

  completion-check:
    name: Shell completion (bash, zsh)
    runs-on: ubuntu-latest
    needs: [optimize_ci, setup]
    if: ${{ needs.optimize_ci.outputs.skip != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate and verify completion scripts
        run: |
          make completion-check

  generate-o11y-check:
    name: Generated metrics
    runs-on: ubuntu-latest
    needs: [optimize_ci, setup]
    if: ${{ needs.optimize_ci.outputs.skip != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate and verify metric code
        run: |
          make generate-o11y-check
