name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Release - ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build host platform
        run: |
          echo "BUILD_HOST_OS=$(go env GOHOSTOS)" >> $GITHUB_ENV
          echo "BUILD_HOST_ARCH=$(go env GOHOSTARCH)" >> $GITHUB_ENV

      - name: Run GoReleaser (split)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser-pro
          version: "v2.12.5"
          args: release --clean --split
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          DOCKER_REGISTRY: ghcr.io
          BUILD_HOST_OS: ${{ env.BUILD_HOST_OS }}
          BUILD_HOST_ARCH: ${{ env.BUILD_HOST_ARCH }}
          GGOOS: ${{ matrix.goos }}
          GGOARCH: ${{ matrix.goarch }}

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 7

  merge-release:
    name: Merge Release
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build host platform
        run: |
          echo "BUILD_HOST_OS=$(go env GOHOSTOS)" >> $GITHUB_ENV
          echo "BUILD_HOST_ARCH=$(go env GOHOSTARCH)" >> $GITHUB_ENV

      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Run GoReleaser (merge)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser-pro
          version: "v2.12.5"
          args: continue --merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          DOCKER_REGISTRY: ghcr.io
          BUILD_HOST_OS: ${{ env.BUILD_HOST_OS }}
          BUILD_HOST_ARCH: ${{ env.BUILD_HOST_ARCH }}
